<!-- @dsCard group="Illustration" height=400 subtitle="Ambient HDB estate scene · live" -->
<!doctype html>
<html lang="en-SG">
<head>
<meta charset="utf-8">
<style>
  html, body { margin:0; background:var(--bg-page); }
  .hero-scene { display:block; width:100%; height:auto; }
  .hs-sky    { fill:var(--color-white, #ffffff); stroke:var(--color-ink, #1d1d24); stroke-width:1.5; }
  .hs-venus  { fill:var(--color-periwinkle, #e9ecf6); }
  .hs-uni    { fill:var(--color-pink, #f5a3c7); }
  .hs-planet { fill:var(--color-blush, #fbd5e5); }
  .hs-galaxy { fill:var(--color-ink, #1d1d24); }
  .hs-white  { fill:var(--color-white, #ffffff); }
  .hs-page   { fill:var(--bg-page, #f3f3f5); }
  .hs-ink    { stroke:var(--color-ink, #1d1d24); fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .hs-blue   { stroke:var(--color-pink, #f5a3c7); fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .hs-win-back  { fill:var(--color-periwinkle, #e9ecf6); }
  .hs-win-front { fill:var(--color-pink, #f5a3c7); }

  /* limbs, wheels and the cat's tail */
  .hs-anim { transform-box:fill-box; }
  .hs-leg  { transform-origin:50% 0; animation:hs-swing .7s ease-in-out infinite alternate; }
  .hs-leg--b { animation-direction:alternate-reverse; }
  .hs-push { transform-origin:50% 0; animation:hs-push 1.1s ease-in-out infinite; }
  .hs-bob  { animation:hs-bob .35s ease-in-out infinite alternate; }
  .hs-spin { transform-origin:50% 50%; animation:hs-spin .9s linear infinite; }
  .hs-tail { transform-origin:0% 100%; animation:hs-tail 2.4s ease-in-out infinite; }
  .hs-fig--slow .hs-leg { animation-duration:.9s; }
  @keyframes hs-swing { from { transform:rotate(-22deg); } to { transform:rotate(22deg); } }
  @keyframes hs-push  { 0%,100% { transform:rotate(-8deg); } 50% { transform:rotate(38deg); } }
  @keyframes hs-bob   { from { transform:translateY(0); } to { transform:translateY(-1.2px); } }
  @keyframes hs-spin  { to { transform:rotate(360deg); } }
  @keyframes hs-tail  { 0%,100% { transform:rotate(0); } 50% { transform:rotate(-24deg); } }

  /* movement: each resident follows the ground curve with a CSS motion path – no script needed */
  .hs-fig { transform-box:view-box; offset-anchor:0 0; offset-rotate:0deg; }
  .hs-fig--aunty, .hs-fig--worker { offset-path:path('M40 352.1 L50 352.6 L60 353.0 L70 353.3 L80 353.5 L90 353.6 L100 353.6 L110 353.5 L120 353.3 L130 353.1 L140 352.8 L150 352.5 L160 352.2 L170 351.9 L180 351.6 L190 351.3 L200 351.1 L210 350.9 L220 350.8 L230 350.8 L240 350.9 L250 351.0 L260 351.2 L270 351.5 L280 351.9 L290 352.3 L300 352.7 L310 353.2 L320 353.6 L330 354.1 L340 354.5 L350 355.0 L360 355.3 L370 355.6 L380 355.8 L390 355.9 L400 355.9 L410 355.8 L420 355.5 L430 355.2 L440 354.7 L450 354.1 L460 353.3 L470 352.5 L480 351.6 L490 350.5 L500 349.5 L510 348.3 L520 347.1 L530 346.0 L540 344.8 L550 343.6 L560 342.5 L570 341.5 L580 340.5 L590 339.6 L600 338.9 L610 338.2 L620 337.6 L630 337.2 L640 336.9 L650 336.7 L660 336.7 L670 336.7 L680 336.9 L690 337.1 L700 337.4 L710 337.8 L720 338.2 L730 338.6 L740 339.0 L750 339.4 L760 339.8 L770 340.2 L780 340.5 L790 340.7 L800 340.9 L810 341.0 L820 341.0 L830 341.0 L840 340.9 L850 340.7 L860 340.4 L870 340.1 L880 339.8 L890 339.5 L900 339.1 L910 338.7 L920 338.4 L930 338.1 L940 337.9 L950 337.8 L960 337.7 L970 337.7 L980 337.9 L990 338.1 L1000 338.5 L1010 339.0 L1020 339.6 L1030 340.3 L1040 341.2 L1050 342.1 L1060 343.1 L1070 344.2 L1080 345.3 L1090 346.4 L1100 347.6 L1110 348.8 L1120 349.9 L1130 351.0 L1140 352.1 L1150 353.0 L1160 353.9'); }
  .hs-fig--kid, .hs-fig--cyclist { offset-path:path('M-60 342.2 L-50 343.3 L-40 344.5 L-30 345.6 L-20 346.8 L-10 347.8 L0 348.9 L10 349.8 L20 350.7 L30 351.4 L40 352.1 L50 352.6 L60 353.0 L70 353.3 L80 353.5 L90 353.6 L100 353.6 L110 353.5 L120 353.3 L130 353.1 L140 352.8 L150 352.5 L160 352.2 L170 351.9 L180 351.6 L190 351.3 L200 351.1 L210 350.9 L220 350.8 L230 350.8 L240 350.9 L250 351.0 L260 351.2 L270 351.5 L280 351.9 L290 352.3 L300 352.7 L310 353.2 L320 353.6 L330 354.1 L340 354.5 L350 355.0 L360 355.3 L370 355.6 L380 355.8 L390 355.9 L400 355.9 L410 355.8 L420 355.5 L430 355.2 L440 354.7 L450 354.1 L460 353.3 L470 352.5 L480 351.6 L490 350.5 L500 349.5 L510 348.3 L520 347.1 L530 346.0 L540 344.8 L550 343.6 L560 342.5 L570 341.5 L580 340.5 L590 339.6 L600 338.9 L610 338.2 L620 337.6 L630 337.2 L640 336.9 L650 336.7 L660 336.7 L670 336.7 L680 336.9 L690 337.1 L700 337.4 L710 337.8 L720 338.2 L730 338.6 L740 339.0 L750 339.4 L760 339.8 L770 340.2 L780 340.5 L790 340.7 L800 340.9 L810 341.0 L820 341.0 L830 341.0 L840 340.9 L850 340.7 L860 340.4 L870 340.1 L880 339.8 L890 339.5 L900 339.1 L910 338.7 L920 338.4 L930 338.1 L940 337.9 L950 337.8 L960 337.7 L970 337.7 L980 337.9 L990 338.1 L1000 338.5 L1010 339.0 L1020 339.6 L1030 340.3 L1040 341.2 L1050 342.1 L1060 343.1 L1070 344.2 L1080 345.3 L1090 346.4 L1100 347.6 L1110 348.8 L1120 349.9 L1130 351.0 L1140 352.1 L1150 353.0 L1160 353.9 L1170 354.7 L1180 355.4 L1190 355.9 L1200 356.3 L1210 356.6 L1220 356.7 L1230 356.8 L1240 356.7 L1250 356.5 L1260 356.2'); offset-rotate:auto; }
  .hs-fig--aunty   { offset-distance:15%; animation:hs-pace 150s linear -20s infinite; }
  .hs-fig--aunty .hs-flip { animation:hs-face 150s linear -20s infinite; }
  .hs-fig--worker  { offset-distance:70%; animation:hs-pace 80s linear -52s infinite; }
  .hs-fig--worker .hs-flip { animation:hs-face 80s linear -52s infinite; }
  .hs-fig--kid     { offset-distance:35%; animation:hs-ride 30s linear -10s infinite; }
  .hs-fig--cyclist { offset-distance:10%; animation:hs-ride 18s linear -2s infinite reverse; }
  .hs-fig--cyclist .hs-flip { transform:scale(-1,1); }
  /* walk right, pause, turn, walk back, pause */
  @keyframes hs-pace { 0% { offset-distance:0%; } 47% { offset-distance:100%; } 50% { offset-distance:100%; } 97% { offset-distance:0%; } 100% { offset-distance:0%; } }
  @keyframes hs-face { 0%, 48.4% { transform:scale(1,1); } 48.5%, 98.4% { transform:scale(-1,1); } 98.5%, 100% { transform:scale(1,1); } }
  @keyframes hs-ride { from { offset-distance:0%; } to { offset-distance:100%; } }
  @supports not (offset-path: path('M0 0 L1 1')) { .hs-fig { display:none; } }
  @media (prefers-reduced-motion: reduce) {
    .hs-leg, .hs-push, .hs-bob, .hs-spin, .hs-tail, .hs-fig, .hs-flip { animation:none; }
  }
</style>
