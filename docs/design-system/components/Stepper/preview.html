<!-- @dsCard group="Navigation" height=190 width=900 subtitle="Numbered step track and mobile progress · static rendition" -->
<!doctype html><html lang="en-SG"><head><meta charset="utf-8"><style>body{margin:0;padding:28px 24px;background:var(--bg-surface)}.stepper-mobile{display:block!important;max-width:320px;margin:28px auto 0}</style></head><body>
<ol class="step-track" aria-label="Progress">
  <li class="step-track__item step-track__item--done"><span class="step-track__num" aria-hidden="true">1</span>What matters<span class="visually-hidden">, done</span></li>
  <li class="step-track__item step-track__item--current" aria-current="step"><span class="step-track__num" aria-hidden="true">2</span>About you</li>
  <li class="step-track__item"><span class="step-track__num" aria-hidden="true">3</span>Your BTO</li>
  <li class="step-track__item"><span class="step-track__num" aria-hidden="true">4</span>Resale flat</li>
</ol>
<div class="stepper-mobile" role="status">
  <p class="stepper-mobile__label">Step 2 of 4 · About you</p>
  <div class="stepper-mobile__track" role="progressbar" aria-valuenow="2" aria-valuemin="1" aria-valuemax="4"><div class="stepper-mobile__fill" style="width:50%"></div></div>
</div>
</body></html>
