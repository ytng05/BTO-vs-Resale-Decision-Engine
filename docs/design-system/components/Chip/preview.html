<!-- @dsCard group="Forms" height=460 width=1040 subtitle="Grouped multi-select pills with icons · try it" -->
<!doctype html><html lang="en-SG"><head><meta charset="utf-8"><style>body{margin:0;padding:32px 40px;background:var(--bg-surface)}.ico{fill:none;stroke:var(--text-primary);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}</style></head><body>
<form style="max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:22px">
  <fieldset class="border-0 p-0 m-0" style="display:flex;flex-direction:column;gap:16px">
    <legend class="divider-label w-100" style="margin-bottom:16px">Location</legend>
    <div class="chip-group chip-group--center">
      <label class="chip"><input class="chip__input" type="checkbox" name="matters" value="parents" checked><span class="chip__face"><svg class="chip__icon ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="7" r="4"/><path d="M2 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2M16 3.1a4 4 0 0 1 0 7.8M22 21v-2a4 4 0 0 0-3-3.9"/></svg>Near my parents</span></label>
      <label class="chip"><input class="chip__input" type="checkbox" name="matters" value="mrt"><span class="chip__face"><svg class="chip__icon ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M9 21l1.5-4M15 21l-1.5-4"/></svg>Near an MRT station</span></label>
      <label class="chip"><input class="chip__input" type="checkbox" name="matters" value="school"><span class="chip__face"><svg class="chip__icon ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/></svg>Near good schools</span></label>
      <label class="chip"><input class="chip__input" type="checkbox" name="matters" value="work"><span class="chip__face"><svg class="chip__icon ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Near work</span></label>
      <label class="chip"><input class="chip__input" type="checkbox" name="matters" value="mature"><span class="chip__face"><svg class="chip__icon ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22v-6M12 2 5 12h4l-3 4h12l-3-4h4z"/></svg>Mature estate</span></label>
    </div>
  </fieldset>
  <fieldset class="border-0 p-0 m-0" style="display:flex;flex-direction:column;gap:16px">
    <legend class="divider-label w-100" style="margin-bottom:16px">Timing and money</legend>
    <div class="chip-group chip-group--center">
      <label class="chip"><input class="chip__input" type="checkbox" name="matters" value="soon" checked><span class="chip__face"><svg class="chip__icon ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Move in within 2 years</span></label>
      <label class="chip"><input class="chip__input" type="checkbox" name="matters" value="cash" checked><span class="chip__face"><svg class="chip__icon ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18"/><circle cx="16" cy="15" r="1"/></svg>Least cash upfront</span></label>
      <label class="chip"><input class="chip__input" type="checkbox" name="matters" value="monthly"><span class="chip__face"><svg class="chip__icon ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Lowest monthly payment</span></label>
      <label class="chip"><input class="chip__input" type="checkbox" name="matters" value="space"><span class="chip__face"><svg class="chip__icon ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>More space</span></label>
    </div>
  </fieldset>
  <button type="button" class="btn btn-primary btn-wide">Next</button>
</form>
</body></html>
