name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    # Throwaway MongoDB for server/tests/db.test.js. Lives only for this run; never touches Atlas.
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        # Wait until Mongo answers before the steps run.
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          MONGODB_URI_TEST: mongodb://localhost:27017/bto_test
          JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789

      # Build with mock data so the Cypress smoke test does not depend on unfinished engine routes.
      - run: npm run build
        env:
          VITE_USE_MOCK: 'true'
      - uses: cypress-io/github-action@v6
        with:
          install: false
          start: npm start
          wait-on: 'http://localhost:3000/api/health'
        env:
          PORT: 3000
          # The same throwaway mongo service, so cypress/e2e/scenarios.cy.js can register and save.
          MONGODB_URI: mongodb://localhost:27017/bto_e2e
          JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
