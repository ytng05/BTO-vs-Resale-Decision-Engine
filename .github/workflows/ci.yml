name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Build with mock data so the Cypress smoke test does not depend on unfinished engine routes.
      - run: npm run build
        env:
          VITE_USE_MOCK: 'true'
      - uses: cypress-io/github-action@v6
        with:
          install: false
          start: npm start
          wait-on: 'http://localhost:3000/api/health'
          wait-on-timeout: 120
      - uses: cypress-io/github-action@v6
        with:
          install: false
          start: npm start
          wait-on: 'http://localhost:3000/api/health'
          wait-on-timeout: 120
        env:
          PORT: 3000

